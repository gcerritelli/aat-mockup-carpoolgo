<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ride — CarpoolGo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: 'Segoe UI', Arial, sans-serif; color: #1b2a22; background: #dfe7e2; }

  .phone { max-width: 440px; margin: 0 auto; min-height: 100vh; background: #f4f9f5; box-shadow: 0 0 50px rgba(16, 50, 31, 0.12); }

  .topbar {
    background: #10321f; color: #ffffff; padding: 18px 22px;
    position: sticky; top: 0; display: flex; align-items: center; gap: 14px;
  }
  .topbar a.back { color: #d9ecd9; text-decoration: none; font-size: 20px; }
  .topbar .titulo { font-size: 18px; font-weight: 700; }

  main { padding: 20px; }
  .card { background: #ffffff; border-radius: 14px; padding: 18px 20px; box-shadow: 0 6px 18px rgba(16, 50, 31, 0.08); margin-bottom: 18px; }
  h2 { font-size: 14px; color: #10321f; margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.4px; }
  .card p { font-size: 14px; color: #445248; line-height: 1.5; }

  .avatar {
    width: 34px; height: 34px; border-radius: 50%;
    background: #4fd18b; color: #0d2416;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; flex-shrink: 0; overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .participante-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; }
  .participante-row .name { font-size: 14px; font-weight: 600; color: #10321f; }
  .participante-row .tag { font-size: 12px; color: #6b7d70; }

  label { display: block; font-size: 14px; font-weight: 600; color: #2b3c31; margin-bottom: 6px; margin-top: 14px; }
  label:first-of-type { margin-top: 0; }
  input[type="text"], input[type="number"] {
    width: 100%; padding: 12px 14px; border: 1px solid #cfe0d4; border-radius: 8px;
    font-size: 15px; font-family: inherit; color: #1b2a22;
  }
  input:focus { outline: 2px solid #4fd18b; border-color: transparent; }
  .hint { font-size: 12px; color: #6b7d70; margin-top: 6px; }

  button.accion {
    width: 100%; background: #4fd18b; color: #0d2416; border: none;
    padding: 14px; font-size: 15px; font-weight: 700; border-radius: 26px; cursor: pointer; margin-top: 16px;
  }
  button.accion:hover { background: #3fc07c; }
  button.accion:disabled { opacity: 0.6; cursor: wait; }
  button.rechazar-btn {
    width: 100%; background: none; border: 1px solid #e0b4b4; color: #9c2f2f;
    padding: 12px; border-radius: 26px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 10px;
  }

  .costo-total { font-size: 28px; font-weight: 700; color: #10321f; margin-bottom: 4px; }
  .costo-nota { font-size: 12px; color: #93a69a; margin-bottom: 16px; }
  .deuda-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid #eef4ef;
  }
  .deuda-row:last-child { border-bottom: none; }
  .deuda-row .monto { font-weight: 700; color: #10321f; }

  .empty-mini { font-size: 13px; color: #93a69a; }

  .day-toggle { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
  .day-toggle label {
    margin: 0; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
    border: 1px solid #cfe0d4; border-radius: 50%; cursor: pointer; font-weight: 700; font-size: 12px;
  }
  .day-toggle input { position: absolute; opacity: 0; pointer-events: none; }
  .day-toggle label:has(input:checked) { background: #e3f6ea; border-color: #4fd18b; color: #10321f; }

  .checkbox-inline { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 500; color: #2b3c31; margin-top: 16px; cursor: pointer; }
  .checkbox-inline input { width: 18px; height: 18px; }
</style>
</head>
<body>

  <div class="phone">
    <div class="topbar">
      <a class="back" href="app.html">←</a>
      <div class="titulo">Detalle del Ride</div>
    </div>
    <main id="contenido">
      <p class="empty-mini">Cargando...</p>
    </main>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBM9QJkGNsOP_6gqwKFagrFLrTDmkloboM",
      authDomain: "carpoolgo-b7728.firebaseapp.com",
      projectId: "carpoolgo-b7728",
      storageBucket: "carpoolgo-b7728.firebasestorage.app",
      messagingSenderId: "133384054341",
      appId: "1:133384054341:web:f8ef0cdfaafbbe9ebf652c"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // Estimado de precio de gasolina por km, en la moneda local del PAÍS DEL HOST.
    // Son cifras de referencia, no un feed de precios en vivo — ampliable a pedido.
    const monedaPorPais = {
      "México": { moneda: "MXN", simbolo: "$", costoPorKm: 2.5 },
      "Estados Unidos": { moneda: "USD", simbolo: "$", costoPorKm: 0.09 },
      "Canadá": { moneda: "CAD", simbolo: "$", costoPorKm: 0.12 },
      "Reino Unido": { moneda: "GBP", simbolo: "£", costoPorKm: 0.14 },
      "Francia": { moneda: "EUR", simbolo: "€", costoPorKm: 0.13 },
      "Alemania": { moneda: "EUR", simbolo: "€", costoPorKm: 0.13 },
      "España": { moneda: "EUR", simbolo: "€", costoPorKm: 0.12 },
      "Italia": { moneda: "EUR", simbolo: "€", costoPorKm: 0.14 },
      "Portugal": { moneda: "EUR", simbolo: "€", costoPorKm: 0.12 },
      "Países Bajos": { moneda: "EUR", simbolo: "€", costoPorKm: 0.15 },
      "Bélgica": { moneda: "EUR", simbolo: "€", costoPorKm: 0.13 },
      "Austria": { moneda: "EUR", simbolo: "€", costoPorKm: 0.12 },
      "Irlanda": { moneda: "EUR", simbolo: "€", costoPorKm: 0.13 },
      "Finlandia": { moneda: "EUR", simbolo: "€", costoPorKm: 0.14 },
      "Grecia": { moneda: "EUR", simbolo: "€", costoPorKm: 0.13 },
      "Suiza": { moneda: "CHF", simbolo: "CHF", costoPorKm: 0.14 },
      "Suecia": { moneda: "SEK", simbolo: "kr", costoPorKm: 1.3 },
      "Noruega": { moneda: "NOK", simbolo: "kr", costoPorKm: 1.4 },
      "Dinamarca": { moneda: "DKK", simbolo: "kr", costoPorKm: 1.0 },
      "Polonia": { moneda: "PLN", simbolo: "zł", costoPorKm: 0.5 },
      "Brasil": { moneda: "BRL", simbolo: "R$", costoPorKm: 0.5 },
      "Argentina": { moneda: "ARS", simbolo: "$", costoPorKm: 100 },
      "Chile": { moneda: "CLP", simbolo: "$", costoPorKm: 90 },
      "Colombia": { moneda: "COP", simbolo: "$", costoPorKm: 380 },
      "Japón": { moneda: "JPY", simbolo: "¥", costoPorKm: 13 },
      "China": { moneda: "CNY", simbolo: "¥", costoPorKm: 0.6 },
      "India": { moneda: "INR", simbolo: "₹", costoPorKm: 6 },
      "Australia": { moneda: "AUD", simbolo: "$", costoPorKm: 0.13 }
    };
    const MONEDA_DEFAULT = { moneda: "USD", simbolo: "$", costoPorKm: 0.10 };

    function monedaParaPais(pais) {
      return monedaPorPais[pais] || MONEDA_DEFAULT;
    }

    function escapeHtml(texto) {
      const div = document.createElement('div');
      div.textContent = texto == null ? '' : String(texto);
      return div.innerHTML;
    }
    function inicial(nombre) {
      return (nombre || '?').trim().charAt(0).toUpperCase();
    }

    const params = new URLSearchParams(window.location.search);
    const rideId = params.get('id');
    if (!rideId) window.location.href = 'app.html';

    const cont = document.getElementById('contenido');

    async function cargarPerfiles(uids) {
      const docs = await Promise.all(uids.map((id) => db.collection('usuarios').doc(id).get()));
      const mapa = {};
      docs.forEach((d, i) => { mapa[uids[i]] = d.exists ? d.data() : { nombre: 'Sin nombre' }; });
      return mapa;
    }

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = 'registro.html';
        return;
      }
      const miUid = user.uid;

      const rideDoc = await db.collection('rides').doc(rideId).get();
      if (!rideDoc.exists) {
        cont.innerHTML = '<p class="empty-mini">Este ride ya no existe.</p>';
        return;
      }
      const ride = rideDoc.data();
      if (!ride.participantes.includes(miUid)) {
        window.location.href = 'app.html';
        return;
      }

      const perfiles = await cargarPerfiles(ride.participantes);
      const esHost = ride.hostUid === miUid;
      const hostNombre = perfiles[ride.hostUid] ? perfiles[ride.hostUid].nombre : 'el host';

      const listaParticipantesHtml = ride.participantes.map((uid) => {
        const p = perfiles[uid] || {};
        const esEsteHost = uid === ride.hostUid;
        return `
          <div class="participante-row">
            <div class="avatar">${p.fotoURL ? `<img src="${p.fotoURL}" alt="">` : escapeHtml(inicial(p.nombre))}</div>
            <div>
              <div class="name">${escapeHtml(p.nombre || 'Sin nombre')}${uid === miUid ? ' (tú)' : ''}</div>
              <div class="tag">${esEsteHost ? 'Host / conductor' : 'Pasajero'}</div>
            </div>
          </div>
        `;
      }).join('');

      if (ride.estado === 'rechazado') {
        cont.innerHTML = `
          <div class="card">
            <h2>Ride rechazado</h2>
            <p>${escapeHtml(hostNombre)} no pudo aceptar manejar este ride.</p>
          </div>
        `;
        return;
      }

      if (ride.estado === 'pendiente_host' && esHost) {
        cont.innerHTML = `
          <div class="card">
            <h2>Te invitaron a manejar</h2>
            <p>${escapeHtml(ride.creadoPorNombre || 'Alguien')} te agregó como host de un ride con estas personas:</p>
          </div>
          <div class="card">${listaParticipantesHtml}</div>
          <div class="card">
            <button class="accion" id="btn-aceptar">Aceptar y manejar</button>
            <button class="rechazar-btn" id="btn-rechazar">Rechazar</button>
          </div>
        `;
        document.getElementById('btn-aceptar').addEventListener('click', async () => {
          await db.collection('rides').doc(rideId).set({ estado: 'activo' }, { merge: true });
          window.location.reload();
        });
        document.getElementById('btn-rechazar').addEventListener('click', async () => {
          await db.collection('rides').doc(rideId).set({ estado: 'rechazado' }, { merge: true });
          window.location.reload();
        });
        return;
      }

      if (ride.estado === 'pendiente_host' && !esHost) {
        cont.innerHTML = `
          <div class="card">
            <h2>Esperando al host</h2>
            <p>Le mandamos la invitación a ${escapeHtml(hostNombre)} para manejar este ride. En cuanto la acepte, vas a poder ver los detalles aquí.</p>
          </div>
          <div class="card">${listaParticipantesHtml}</div>
        `;
        return;
      }

      if (ride.estado === 'activo' && esHost) {
        const miMoneda = monedaParaPais((perfiles[ride.hostUid] || {}).pais);
        cont.innerHTML = `
          <div class="card">${listaParticipantesHtml}</div>
          <div class="card">
            <h2>Termina el ride</h2>
            <p style="margin-bottom:10px;">Captura estos datos al terminar para calcular cuánto se gastó en gasolina y dividirlo entre todos (tú no pagas, solo tus pasajeros).</p>
            <label for="origen">Origen</label>
            <input type="text" id="origen" placeholder="De dónde salieron">
            <label for="destino">Destino</label>
            <input type="text" id="destino" placeholder="A dónde llegaron">
            <label for="km">Distancia total (km)</label>
            <input type="number" id="km" min="1" step="0.1" placeholder="Ej. 12.5">
            <label for="min">Duración total (minutos)</label>
            <input type="number" id="min" min="1" placeholder="Ej. 35">

            <label>¿Se repite en la semana? (opcional)</label>
            <div class="day-toggle" id="dias-semana">
              <label><input type="checkbox" value="L"><span>L</span></label>
              <label><input type="checkbox" value="M"><span>M</span></label>
              <label><input type="checkbox" value="Mi"><span>Mi</span></label>
              <label><input type="checkbox" value="J"><span>J</span></label>
              <label><input type="checkbox" value="V"><span>V</span></label>
              <label><input type="checkbox" value="S"><span>S</span></label>
              <label><input type="checkbox" value="D"><span>D</span></label>
            </div>
            <p class="hint">Si marcas días, calculamos el gasto multiplicado por esos días de la semana (para un ride que se repite). Si no marcas ninguno, se calcula solo por este viaje.</p>

            <label class="checkbox-inline"><input type="checkbox" id="redondo"> Fue de ida y vuelta (redondo)</label>

            <p class="hint">Estimamos el costo con ${miMoneda.simbolo}${miMoneda.costoPorKm} ${miMoneda.moneda} por km (precio de gasolina de referencia en tu país). Es un cálculo aproximado, no viene de GPS.</p>
            <button class="accion" id="btn-terminar">Calcular y dividir gasto</button>
            <div class="empty-mini" id="msg-ride-error" style="display:none;color:#9c2f2f;margin-top:8px;"></div>
          </div>
        `;
        document.getElementById('btn-terminar').addEventListener('click', async () => {
          const km = parseFloat(document.getElementById('km').value);
          const min = parseFloat(document.getElementById('min').value);
          const origen = document.getElementById('origen').value.trim();
          const destino = document.getElementById('destino').value.trim();
          const errEl = document.getElementById('msg-ride-error');

          if (!km || km <= 0) {
            errEl.textContent = 'Indica la distancia en kilómetros.';
            errEl.style.display = 'block';
            return;
          }

          const dias = Array.from(document.querySelectorAll('#dias-semana input:checked')).map((el) => el.value);
          const esRedondo = document.getElementById('redondo').checked;
          const multiplicadorRedondo = esRedondo ? 2 : 1;
          const multiplicadorDias = dias.length > 0 ? dias.length : 1;

          const pasajeros = ride.participantes.filter((uid) => uid !== ride.hostUid);
          const costoTotal = km * miMoneda.costoPorKm * multiplicadorRedondo * multiplicadorDias;
          const montoPorPasajero = pasajeros.length > 0 ? costoTotal / pasajeros.length : 0;
          const deudas = {};
          pasajeros.forEach((uid) => { deudas[uid] = montoPorPasajero; });

          const btn = document.getElementById('btn-terminar');
          btn.disabled = true;
          btn.textContent = 'Calculando...';

          await db.collection('rides').doc(rideId).set({
            estado: 'completado',
            origen: origen || null,
            destino: destino || null,
            distanciaKm: km,
            duracionMin: min || null,
            dias: dias,
            esRedondo: esRedondo,
            costoTotal: costoTotal,
            moneda: miMoneda.moneda,
            simboloMoneda: miMoneda.simbolo,
            deudas: deudas,
            completadoEn: firebase.firestore.FieldValue.serverTimestamp()
          }, { merge: true });

          window.location.reload();
        });
        return;
      }

      if (ride.estado === 'activo' && !esHost) {
        cont.innerHTML = `
          <div class="card">${listaParticipantesHtml}</div>
          <div class="card">
            <h2>Ride en curso</h2>
            <p>${escapeHtml(hostNombre)} está manejando. Cuando termine el viaje va a capturar los datos aquí mismo y vas a ver cuánto le toca pagar a cada quien.</p>
          </div>
        `;
        return;
      }

      if (ride.estado === 'completado') {
        const deudas = ride.deudas || {};
        const simbolo = ride.simboloMoneda || '$';
        const moneda = ride.moneda || 'MXN';
        let panelDeuda = '';
        if (esHost) {
          const filas = Object.keys(deudas).map((uid) => {
            const p = perfiles[uid] || {};
            return `
              <div class="deuda-row">
                <span>${escapeHtml(p.nombre || 'Alguien')} te debe</span>
                <span class="monto">${simbolo}${Math.round(deudas[uid])} ${moneda}</span>
              </div>
            `;
          }).join('');
          panelDeuda = `<div class="card"><h2>Te deben</h2>${filas || '<p class="empty-mini">Nadie te debe nada en este ride.</p>'}</div>`;
        } else {
          const monto = deudas[miUid] || 0;
          panelDeuda = `
            <div class="card">
              <h2>Le debes a ${escapeHtml(hostNombre)}</h2>
              <div class="deuda-row" style="border:none;padding:0;">
                <span>Tu parte del gasto de gasolina</span>
                <span class="monto">${simbolo}${Math.round(monto)} ${moneda}</span>
              </div>
            </div>
          `;
        }

        cont.innerHTML = `
          <div class="card">
            <h2>Ride completado</h2>
            <div class="costo-total">${simbolo}${Math.round(ride.costoTotal || 0)} ${moneda}</div>
            <div class="costo-nota">${ride.distanciaKm || '—'} km · ${ride.duracionMin || '—'} min · ${escapeHtml(ride.origen || '')}${ride.origen && ride.destino ? ' → ' : ''}${escapeHtml(ride.destino || '')}</div>
            <div class="costo-nota">${ride.esRedondo ? 'Ida y vuelta' : 'Solo ida'}${ride.dias && ride.dias.length > 0 ? ` · Se repite: ${ride.dias.join(', ')} (×${ride.dias.length})` : ' · Viaje único'}</div>
          </div>
          ${panelDeuda}
          <div class="card">${listaParticipantesHtml}</div>
        `;
        return;
      }

      cont.innerHTML = '<p class="empty-mini">No pudimos cargar este ride.</p>';
    });
  </script>
</body>
</html>
