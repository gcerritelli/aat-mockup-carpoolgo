<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chats — CarpoolGo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { font-family: 'Segoe UI', Arial, sans-serif; color: #1b2a22; background: #dfe7e2; }

  .phone { max-width: 440px; margin: 0 auto; min-height: 100vh; background: #f4f9f5; box-shadow: 0 0 50px rgba(16, 50, 31, 0.12); }

  .topbar {
    background: #10321f;
    color: #ffffff;
    padding: 18px 22px;
    position: sticky;
    top: 0;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .topbar a.back { color: #d9ecd9; text-decoration: none; font-size: 20px; }
  .topbar .titulo { font-size: 18px; font-weight: 700; }

  .lista { padding: 12px; }
  .chat-row {
    display: flex;
    align-items: center;
    gap: 14px;
    background: #ffffff;
    border-radius: 14px;
    padding: 14px 16px;
    box-shadow: 0 4px 14px rgba(16, 50, 31, 0.06);
    margin-bottom: 10px;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
  }
  .avatar {
    width: 48px; height: 48px; border-radius: 50%;
    background: #4fd18b; color: #0d2416;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px; flex-shrink: 0;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .chat-info { min-width: 0; }
  .chat-info .name { font-weight: 700; font-size: 15px; color: #10321f; }
  .chat-info .preview { font-size: 13px; color: #6b7d70; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .empty-state { text-align: center; padding: 50px 24px; color: #6b7d70; font-size: 14px; }
</style>
</head>
<body>

  <div class="phone">
    <div class="topbar">
      <a class="back" href="app.html">←</a>
      <div class="titulo">Chats</div>
    </div>
    <div class="lista" id="lista-chats">
      <div class="empty-state">Cargando tus amigos...</div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBM9QJkGNsOP_6gqwKFagrFLrTDmkloboM",
      authDomain: "carpoolgo-b7728.firebaseapp.com",
      projectId: "carpoolgo-b7728",
      storageBucket: "carpoolgo-b7728.firebasestorage.app",
      messagingSenderId: "133384054341",
      appId: "1:133384054341:web:f8ef0cdfaafbbe9ebf652c"
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    function escapeHtml(texto) {
      const div = document.createElement('div');
      div.textContent = texto == null ? '' : String(texto);
      return div.innerHTML;
    }

    function inicial(nombre) {
      return (nombre || '?').trim().charAt(0).toUpperCase();
    }

    function chatIdPara(a, b) {
      return [a, b].sort().join('_');
    }

    auth.onAuthStateChanged(async (user) => {
      if (!user) {
        window.location.href = 'registro.html';
        return;
      }

      const uid = user.uid;
      const cont = document.getElementById('lista-chats');

      const [amigosSnap, gruposSnap] = await Promise.all([
        db.collection('usuarios').doc(uid).collection('amigos').get(),
        db.collection('chatsGrupo').where('participantes', 'array-contains', uid).get()
      ]);

      let gruposHtml = '';
      if (!gruposSnap.empty) {
        const grupos = await Promise.all(gruposSnap.docs.map(async (d) => {
          const g = d.data();
          const rideId = g.rideId || d.id.replace('ride_', '');
          const otrosIds = (g.participantes || []).filter((id) => id !== uid);
          const perfiles = await Promise.all(otrosIds.map((id) => db.collection('usuarios').doc(id).get()));
          const nombres = perfiles.map((p) => (p.exists ? p.data().nombre : null) || 'Alguien');
          const nombreGrupo = nombres.length <= 2 ? nombres.join(' y ') : `${nombres.slice(0, 2).join(', ')} y ${nombres.length - 2} más`;
          return {
            rideId,
            nombreGrupo,
            ultimoMensaje: g.ultimoMensaje || 'Aún no hay mensajes. ¡Empieza la conversación! 👋'
          };
        }));
        gruposHtml = `
          <div style="font-size:13px;color:#6b7d70;text-transform:uppercase;letter-spacing:0.4px;margin:6px 6px 8px;font-weight:700;">Tus rides</div>
          ${grupos.map((g) => `
            <a class="chat-row" href="chat.html?ride=${encodeURIComponent(g.rideId)}">
              <div class="avatar">🚗</div>
              <div class="chat-info">
                <div class="name">Ride: ${escapeHtml(g.nombreGrupo)}</div>
                <div class="preview">${escapeHtml(g.ultimoMensaje)}</div>
              </div>
            </a>
          `).join('')}
        `;
      }

      let amigosHtml = '';
      if (amigosSnap.empty) {
        if (!gruposHtml) {
          cont.innerHTML = '<div class="empty-state">Todavía no tienes amigos. Ve a Buscar en la app para agregar compañeros y empezar a chatear.</div>';
          return;
        }
      } else {
        const filas = await Promise.all(amigosSnap.docs.map(async (d) => {
          const amistad = d.data();
          const perfilDoc = await db.collection('usuarios').doc(d.id).get();
          const perfil = perfilDoc.exists ? perfilDoc.data() : {};
          const chatId = chatIdPara(uid, d.id);
          const chatDoc = await db.collection('chats').doc(chatId).get();
          const chatData = chatDoc.exists ? chatDoc.data() : {};
          return {
            id: d.id,
            nombre: amistad.nombre,
            fotoURL: perfil.fotoURL || null,
            ultimoMensaje: chatData.ultimoMensaje || 'Todavía no han chateado. Di hola 👋'
          };
        }));

        amigosHtml = filas.map((f) => `
          <a class="chat-row" href="chat.html?con=${encodeURIComponent(f.id)}">
            <div class="avatar">${f.fotoURL ? `<img src="${f.fotoURL}" alt="">` : escapeHtml(inicial(f.nombre))}</div>
            <div class="chat-info">
              <div class="name">${escapeHtml(f.nombre || 'Sin nombre')}</div>
              <div class="preview">${escapeHtml(f.ultimoMensaje)}</div>
            </div>
          </a>
        `).join('');
      }

      cont.innerHTML = gruposHtml + amigosHtml;
    });
  </script>
</body>
</html>
